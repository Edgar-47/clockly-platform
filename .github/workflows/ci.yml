name: CI

on:
  push:
    branches: [main, codex-fastapi-backend-v2]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend_v2
        run: pip install -r ../requirements.txt

      - name: Lint (ruff)
        working-directory: backend_v2
        run: ruff check app tests

      - name: Run tests
        working-directory: backend_v2
        env:
          CLOCKLY_ENV: test
          CLOCKLY_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
        run: pytest -v --tb=short

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Type check
        working-directory: frontend-next
        run: npm run type-check

      - name: Lint
        working-directory: frontend-next
        run: npm run lint

      - name: Build
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ vars.E2E_ENABLED == 'true' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clockly
          POSTGRES_PASSWORD: clockly
          POSTGRES_DB: clockly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate E2E secrets
        shell: bash
        env:
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: |
          if [ -z "$E2E_OWNER_PASSWORD" ]; then
            echo "::error title=Missing E2E_OWNER_PASSWORD::Set the GitHub Actions secret E2E_OWNER_PASSWORD before enabling authenticated E2E."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend_v2
        run: pip install -r ../requirements.txt

      - name: Run DB migrations
        working-directory: backend_v2
        env:
          CLOCKLY_DATABASE_URL: postgresql+psycopg://clockly:clockly@localhost:5432/clockly_test
          CLOCKLY_SECRET_KEY: ci-e2e-secret
        run: alembic upgrade head

      - name: Seed test data
        working-directory: backend_v2
        env:
          CLOCKLY_DATABASE_URL: postgresql+psycopg://clockly:clockly@localhost:5432/clockly_test
          CLOCKLY_SECRET_KEY: ci-e2e-secret
          E2E_OWNER_EMAIL: ${{ vars.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: |
          python seed.py \
            --owner-email "${E2E_OWNER_EMAIL:-owner@clockly.local}" \
            --owner-password "$E2E_OWNER_PASSWORD"

      - name: Start backend
        working-directory: backend_v2
        env:
          CLOCKLY_DATABASE_URL: postgresql+psycopg://clockly:clockly@localhost:5432/clockly_test
          CLOCKLY_SECRET_KEY: ci-e2e-secret
          CLOCKLY_ENV: production
          CLOCKLY_TRUSTED_HOSTS: localhost,127.0.0.1
          CLOCKLY_CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: uvicorn app.main:app --host 0.0.0.0 --port 8010 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-next
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
        run: npm run build && npm run start &

      - name: Wait for services
        shell: bash
        run: |
          for url in http://localhost:8010/health http://localhost:3000; do
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $url"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run E2E tests
        working-directory: frontend-next
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_OWNER_EMAIL: ${{ vars.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_AUTH_REQUIRED: "true"
          CI: "true"
        run: npm run test:e2e -- --reporter=github

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-next/playwright-report/
          retention-days: 7
