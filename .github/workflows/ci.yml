name: CI

on:
  push:
    branches: [main, codex-fastapi-backend-v2]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend_v2
        run: pip install -r ../requirements.txt

      - name: Run tests
        working-directory: backend_v2
        env:
          CLOCKLY_ENV: test
          CLOCKLY_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
        run: pytest -v --tb=short

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Type check
        working-directory: frontend-next
        run: npm run type-check

      - name: Lint
        working-directory: frontend-next
        run: npm run lint

      - name: Build
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
        run: npm run build
