# Fly.io configuration for ClockLy frontend (Next.js).
# Deploy from the frontend-next/ directory:
#   cd frontend-next && fly deploy --app clockly-app

app    = "clockly-app"
primary_region = "mad"   # Madrid

[build]
  dockerfile = "Dockerfile"

  # These build args are baked into the Next.js bundle at build time.
  # API_URL_INTERNAL: server-to-server proxy destination via Fly internal network.
  #   Format: http://<backend-app-name>.internal:<internal_port>
  #   Must match the backend app name in backend_v2/fly.toml.
  # NEXT_PUBLIC_API_URL: public API origin — baked into client JS and CSP.
  [build.args]
    API_URL_INTERNAL    = "http://clockly-api.internal:8000"
    NEXT_PUBLIC_API_URL = "https://api.clockly.es"
    NEXT_PUBLIC_APP_NAME = "ClockLy"

# ── Non-sensitive runtime env ─────────────────────────────────────────────────
[env]
  NODE_ENV               = "production"
  NEXT_TELEMETRY_DISABLED = "1"

# ── HTTP service ──────────────────────────────────────────────────────────────
[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/health"
    protocol     = "http"
    timeout      = "10s"

# ── VM sizing ─────────────────────────────────────────────────────────────────
[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
